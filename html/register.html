<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | PlayBox Store</title>

    <link rel="icon"
          type="image/png"
          href="../Assets/logo.jpg">

    <!-- Existing Project CSS -->
    <link rel="stylesheet"
          href="../css/style.css">

    <!-- Register Page CSS -->
    <link rel="stylesheet"
          href="../css/register.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">

            <img src="../Assets/logo20.png"
                 alt="PlayStation Store logo"
                 class="logo-icon">

            <span>Play<span>Box</span></span>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>



    <!-- =========================
         REGISTER PAGE
    ========================== -->

    <main class="register-page">


    <!-- =========================
     BACKGROUND VIDEO
    ========================== -->

<video class="register-bg-video"
       autoplay
       muted
       loop
       playsinline>

    <source src="../Assets/bg vid001.webm"
            type="video/wem">

</video>



        <!-- =========================
             VIDEO DARK OVERLAY
        ========================== -->

        <div class="register-background"></div>



        <!-- =========================
             REGISTER CONTAINER
        ========================== -->

        <section class="register-container">


            <!-- =========================
                 CLOSE BUTTON
            ========================== -->

            <a href="index.html"
               class="close-btn">

                ×

            </a>



            <!-- =========================
                 REGISTER BOX
            ========================== -->

            <div class="register-box">


                <!-- =========================
                     REGISTER LOGO
                ========================== -->

                <div class="register-logo">

                    <img src="../Assets/logo20.png"
                         alt="PlayStation Store">

                </div>



                <!-- =========================
                     REGISTER TITLE
                ========================== -->

                <h1>
                    Create Account
                </h1>


                <p class="register-subtitle">
                    Join the PlayBox Store
                </p>



                <!-- =========================
                     REGISTER FORM
                ========================== -->

                <form action="#"
                      method="post">


                    <!-- USERNAME -->

                    <div class="input-group">

                        <input type="text"
                               id="username"
                               name="username"
                               placeholder=" "
                               required>

                        <label for="username">
                            Username
                        </label>

                        <span class="input-icon">
                            👤
                        </span>

                    </div>



                    <!-- EMAIL -->

                    <div class="input-group">

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder=" "
                               required>

                        <label for="email">
                            Email
                        </label>

                        <span class="input-icon">
                            ✉
                        </span>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder=" "
                               required>

                        <label for="password">
                            Password
                        </label>

                        <span class="input-icon">
                            🔒
                        </span>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <input type="password"
                               id="confirm-password"
                               name="confirm-password"
                               placeholder=" "
                               required>

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <span class="input-icon">
                            🔒
                        </span>

                    </div>



                    <!-- TERMS -->

                    <div class="terms">

                        <label>

                            <input type="checkbox"
                                   required>

                            <span>

                                I agree to the

                                <a href="#">
                                    Terms & Conditions
                                </a>

                            </span>

                        </label>

                    </div>



                    <!-- REGISTER BUTTON -->

                    <button type="submit"
                            class="register-btn">

                        Create Account

                    </button>



                    <!-- LOGIN LINK -->

                    <p class="login-text">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>


                </form>


            </div>

        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">


        <!-- FOOTER LOGO -->

        <div class="footer-logo">

            🎮

            <strong>
                PlayBox Store
            </strong>

        </div>



        <!-- FOOTER LINKS -->

        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="upcoming.html">
                Upcoming Games
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="purchases.html">
                My Purchases
            </a>

        </div>



        <!-- SOCIAL LINKS -->

        <div class="social-links">

            <span>f</span>

            <span>𝕏</span>

            <span>◎</span>

            <span>in</span>

            <span>▶</span>

        </div>



        <!-- FOOTER BOTTOM -->

        <div class="footer-bottom">

            <span>
                Terms & Conditions
            </span>

            <span>
                Privacy Policy
            </span>

            <span>
                © 2026 PlayBox Store.
                All Rights Reserved.
            </span>

        </div>


    </footer>


</body>

</html>
